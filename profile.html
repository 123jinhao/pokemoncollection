<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        /* =========================================
           CSS STYLES
           ========================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #333; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            z-index: 10;
        }

        .back-btn:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }

        /* The Main App Container - Now HORIZONTAL */
        .profile-card {
            background-color: white;
            width: 100%;
            max-width: 950px; 
            height: 550px;    
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            overflow: hidden;
            display: flex;
            flex-direction: row; 
            position: relative;
        }

        /* Hero Section (Left Side) */
        .hero-section {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            width: 40%; 
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            transition: background 0.3s ease;
        }

        .header-info {
            position: absolute;
            top: 60px;
            width: 100%;
            padding: 0 30px;
            display: flex;
            flex-direction: column; 
            align-items: flex-start;
        }

        .pokemon-name {
            font-size: 2.5rem;
            text-transform: capitalize;
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 1;
        }

        .pokemon-id {
            font-size: 1.4rem;
            font-weight: bold;
            opacity: 0.9;
            margin-top: 5px;
        }

        .hero-image {
            width: 260px;
            height: 260px;
            object-fit: contain;
            margin-top: 50px;
            z-index: 2;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.4));
            transition: transform 0.3s ease;
        }
        
        .hero-image:hover {
            transform: scale(1.05); 
        }

        /* Details Section (Right Side) */
        .details-section {
            background-color: white;
            width: 60%; 
            height: 100%;
            padding: 40px 50px;
            overflow-y: auto; 
        }

        /* Types */
        .types-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .type-badge {
            padding: 8px 25px;
            border-radius: 25px;
            color: white;
            font-weight: bold;
            text-transform: capitalize;
            font-size: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Section Titles */
        h3 {
            color: #333;
            font-size: 1.3rem;
            margin-bottom: 12px;
            margin-top: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }
        
        h3:first-of-type {
            margin-top: 0;
        }

        /* Story */
        .story {
            font-size: 1.05rem;
            color: #555;
            line-height: 1.6;
            font-style: italic;
        }

        /* Abilities */
        .abilities-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            list-style: none;
        }

        .abilities-list li {
            background-color: #f0f0f0;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #333;
            font-weight: 600;
            border: 1px solid #ddd;
        }

        /* Stats */
        .stat-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .stat-name {
            width: 90px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #777;
            text-transform: uppercase;
        }

        .stat-value {
            width: 40px;
            font-weight: bold;
            color: #333;
            text-align: right;
            margin-right: 20px;
            font-size: 1.1rem;
        }

        .stat-bar-container {
            flex-grow: 1;
            height: 10px;
            background-color: #f0f0f0;
            border-radius: 5px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            border-radius: 5px;
            width: 0%; 
            transition: width 1s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        @media (max-width: 768px) {
            .profile-card {
                flex-direction: column;
                height: 90vh;
            }
            .hero-section { width: 100%; height: 40%; }
            .details-section { width: 100%; height: 60%; }
            .hero-image { width: 200px; height: 200px; margin-top: 40px; }
            .header-info { flex-direction: row; align-items: center; justify-content: space-between; }
        }
    </style>
</head>

        /* =========================================
           TYPE COLORS DICTIONARY
           ========================================= */
        const typeColors = {
            normal: "#A8A77A", fire: "#EE8130", water: "#6390F0",
            electric: "#F7D02C", grass: "#7AC74C", ice: "#96D9D6",
            fighting: "#C22E28", poison: "#A33EA1", ground: "#E2BF65",
            flying: "#A98FF3", psychic: "#F95587", bug: "#A6B91A",
            rock: "#B6A136", ghost: "#735797", dragon: "#6F35FC",
            dark: "#705746", steel: "#B7B7CE", fairy: "#D685AD"
        };


        /* =========================================
           JAVASCRIPT: ENGINE (DO NOT EDIT BELOW)
           ========================================= */

        function loadPokemonData() {
            // Read the ID from the URL (e.g. ?id=1)
            const urlParams = new URLSearchParams(window.location.search);
            let pokemonId = parseInt(urlParams.get('id'));

            // Fallback: If there is no ID in the link, load Charizard (ID 1) automatically
            if (!pokemonId) pokemonId = 1;

            // Find the correct Pokémon in the array
            const selectedPokemon = myPokemonDatabase.find(p => p.id === pokemonId);

            if (!selectedPokemon) {
                document.getElementById('main-card').innerHTML = "<h2 style='padding:50px; text-align:center; width:100%;'>Pokémon Not Found!</h2>";
                return;
            }

            // Inject the Data
            document.getElementById('pkmn-name').innerText = selectedPokemon.name;
            document.getElementById('pkmn-id').innerText = '#' + selectedPokemon.id.toString().padStart(3, '0');
            document.getElementById('pkmn-img').src = selectedPokemon.image;
            document.title = selectedPokemon.name + " - Profile";

            const primaryType = selectedPokemon.types[0].toLowerCase();
            const bgColor = typeColors[primaryType] || "#888";
            document.getElementById('hero-bg').style.background = bgColor;

            const typesContainer = document.getElementById('pkmn-types');
            typesContainer.innerHTML = selectedPokemon.types.map(type => {
                const color = typeColors[type.toLowerCase()] || "#888";
                return `<span class="type-badge" style="background-color: ${color}">${type}</span>`;
            }).join('');

            document.getElementById('pkmn-story').innerText = `"${selectedPokemon.story}"`;

            const abilitiesContainer = document.getElementById('pkmn-abilities');
            abilitiesContainer.innerHTML = selectedPokemon.abilities.map(ability => 
                `<li>${ability}</li>`
            ).join('');

            const statsContainer = document.getElementById('pkmn-stats');
            statsContainer.innerHTML = Object.entries(selectedPokemon.stats).map(([statName, statValue]) => {
                const percentage = Math.min((statValue / 150) * 100, 100);
                
                return `
                    <div class="stat-row">
                        <span class="stat-name">${statName}</span>
                        <span class="stat-value">${statValue}</span>
                        <div class="stat-bar-container">
                            <div class="stat-bar-fill" style="background-color: ${bgColor};" data-width="${percentage}%"></div>
                        </div>
                    </div>
                `;
            }).join('');

            setTimeout(() => {
                const bars = document.querySelectorAll('.stat-bar-fill');
                bars.forEach(bar => {
                    bar.style.width = bar.getAttribute('data-width');
                });
            }, 200);
        }

        window.onload = loadPokemonData;
